services:
  - type: web
    name: hipro-backend
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    autoDeploy: true
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: your_super_secret_jwt_key_here
      - key: DATABASE_URL
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: BASE_URL
        sync: false
      - key: COMPANY_NAME
        value: Hipro
      - key: SUPPORT_PHONE
        value: "+91 98765 43210"
      - key: SUPPORT_EMAIL
        value: support@hipro.com
